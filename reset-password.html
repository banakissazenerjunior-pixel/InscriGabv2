<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Réinitialiser mon mot de passe – InscriGab</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .reset-wrap{max-width:520px;margin:28px auto;padding:0 8px}
    .reset-intro{text-align:center;color:#64748B;margin-bottom:20px}
    #form-nouveau-mdp{max-width:100%;margin:0 auto}
    #etat-reinitialisation{min-height:24px;text-align:center;color:#475569;font-size:14px}
    .reset-back{display:block;text-align:center;margin:18px 0}
  </style>
</head>
<body>
  <a href="index.html" class="logo">Inscri<span>Gab</span></a>
  <main class="reset-wrap">
    <h1>Réinitialiser mon mot de passe</h1>
    <p class="reset-intro">Choisis un nouveau mot de passe pour retrouver l'accès à ton compte InscriGab.</p>
    <p id="etat-reinitialisation" role="status" aria-live="polite">Préparation de la page…</p>
    <form id="form-nouveau-mdp" class="card" style="display:none" novalidate>
      <h2>Choisis ton nouveau mot de passe</h2>
      <label for="mdp1">Nouveau mot de passe (8 caractères minimum)</label>
      <input id="mdp1" type="password" name="mdp1" autocomplete="new-password" minlength="8" required>
      <label for="mdp2">Confirme le mot de passe</label>
      <input id="mdp2" type="password" name="mdp2" autocomplete="new-password" minlength="8" required>
      <button type="submit" class="vert">Enregistrer mon nouveau mot de passe</button>
    </form>
    <a class="reset-back" href="directeur.html">Retour à la connexion</a>
  </main>
  <script src="app.js"></script>
</body>
</html>
