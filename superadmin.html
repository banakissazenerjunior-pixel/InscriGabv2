<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accès Super Admin | InscriGab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="index.html" class="logo">Inscri<span>Gab</span></a>
<h1>Espace Super Admin</h1>

<form id="form-creation-sa" class="card" style="display:none;">
<h2>Créer le compte Super Admin</h2>
<p>Première utilisation : crée ton compte. Il n'y a qu'un seul Super Admin.</p>
<label>Ton nom</label>
<input type="text" name="nom_sa" placeholder="Ex : Banakissa" required>
<label>Email</label>
<input type="email" name="email_sa" placeholder="Ex : admin@inscrigab.ga" required>
<label>Mot de passe (6 caractères minimum)</label>
<input type="password" name="mdp_sa" autocomplete="new-password" required>
<label>Confirmer le mot de passe</label>
<input type="password" name="mdp_sa2" autocomplete="new-password" required>
<button type="submit" class="vert">Créer mon compte et entrer</button>
</form>

<form id="form-connexion-sa" class="card" style="display:none;">
<h2>Connexion Super Admin</h2>
<label>Email</label>
<input type="email" name="email_connexion_sa" required>
<label>Mot de passe</label>
<input type="password" name="mdp_connexion_sa" autocomplete="current-password" required>
<button type="submit">Se connecter</button>
</form>

<p><a href="index.html">← Retour à l'accueil</a></p>
<script src="app.js"></script>
</body>
</html>
